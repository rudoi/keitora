name: Release

# Only GitHub-authored actions (actions/*) are used, so no third-party code ever sees a secret. This workflow is the
# only thing that publishes: scripts/release.ts bumps, commits, tags and pushes; the tag push lands here. A release
# carries the Windows NSIS installer, the Apple Silicon dmg and the Linux x64 AppImage, deb and rpm, plus the in-app
# updater's files: the Windows installer's .sig, Keitora.app.tar.gz with its .sig, and the AppImage's .sig. Tag runs use the `release` environment: they sign the dmg with the
# identity stored there (Developer ID or self-signed) and the updater artifacts with the updater key
# (TAURI_SIGNING_PRIVATE_KEY*), check that each .sig was made by the key whose pubkey is in tauri.conf.json, and fail
# if any of that is missing. Every other run (PR, schedule, dispatch) never sees a secret, builds unsigned without
# updater artifacts, and publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Keeps the release cache warm (see the save steps) and catches runner-image drift between releases.
  schedule:
    - cron: "17 6 * * 1"
  # Builds both installers (as artifacts) when the release files change, so a PR can prove it without publishing.
  # workflow_dispatch only runs once this file is on the default branch.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - "src-tauri/tauri*.json"
      - "src-tauri/entitlements.plist"
      - "scripts/stage-sidecars.mjs"
      - "scripts/signing.mjs"
      - "scripts/build-dmg.sh"
      - "scripts/release.lib.ts"
      - "scripts/bundle-overlay.ts"
      - "scripts/check-updater-sig.ts"
      - "scripts/cli.ts"
      # Toolchain and dependency changes can break a release build that ci.yml's debug build doesn't catch.
      - "rust-toolchain.toml"
      - "Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "package.json"
      - "yarn.lock"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # `yarn install` runs `prepare: husky`; hooks are pointless on CI runners.
  HUSKY: 0
  # Only scheduled and manual runs on main save the release cache: a tag-scoped entry is unreachable from other
  # tags, and PR runs would churn the quota.
  SAVE_RELEASE_CACHE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # Two Windows jobs for the same reason as the two macOS jobs below: the updater key lives in the `release`
  # environment, so the secret-free job (PR, dispatch, schedule) is kept separate from the tag job. Exactly one of
  # the two runs, and both upload the same artifact name.
  build-windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The release profile has its own cache key (cargo-release-...), separate from ci.yml's debug entry.
      # Always restored; saved only by scheduled/manual runs on main (see the save step below).
      - uses: ./.github/actions/setup-rust
        id: cargo-cache
        with:
          key-prefix: cargo-release

      - uses: ./.github/actions/setup-node-yarn

      # NSIS tooling downloads at build time; a flake is handled by re-running the job.
      - name: Build the installer
        run: yarn tauri:bundle

      - name: Find the installer
        id: installer
        run: |
          files=(target/release/bundle/nsis/Keitora_*_x64-setup.exe)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "Expected exactly one installer, found: ${files[*]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: keitora-windows
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # The bundle output is rebuilt every time and already uploaded.
      - name: Save cargo cache
        if: env.SAVE_RELEASE_CACHE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
          trim: target/release/bundle

  # Tag runs only. Builds the installer with signed updater artifacts; a tag without the updater key fails. This job
  # never saves the cache (tag-scoped entries are wasted quota).
  build-windows-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # The expression evaluates to a bare true or false, so no secret value reaches this step or its shell.
      - name: Detect the updater key
        id: updater-key
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'true' || 'false' }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust
        with:
          key-prefix: cargo-release

      - uses: ./.github/actions/setup-node-yarn

      # Fails on a tag without the key (UPDATER_KEY_MISSING) or with the placeholder pubkey.
      - name: Compute the bundle overlay
        env:
          UPDATER_KEY: ${{ steps.updater-key.outputs.has_key }}
        run: yarn --silent tsx scripts/bundle-overlay.ts --target windows --out "$RUNNER_TEMP/bundle-overlay.json"

      # The only step that sees the updater key. The overlay's --config merges after the script's own bundle overlay.
      - name: Build the installer and its updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri:bundle --config "$RUNNER_TEMP/bundle-overlay.json"

      - name: Find the installer and its signature
        id: installer
        run: |
          files=(target/release/bundle/nsis/Keitora_*_x64-setup.exe)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "Expected exactly one installer, found: ${files[*]}" >&2
            exit 1
          fi
          if [ ! -f "${files[0]}.sig" ]; then
            echo "Missing updater signature ${files[0]}.sig" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      # Tauri only warns when the key does not match the committed pubkey; installed copies would reject the update.
      - name: Check the updater signature's key
        env:
          SIG: ${{ steps.installer.outputs.path }}.sig
        run: yarn --silent tsx scripts/check-updater-sig.ts "$SIG"

      # Both files sit in the same folder, so the artifact is flat.
      - uses: actions/upload-artifact@v7
        with:
          name: keitora-windows
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.path }}.sig
          if-no-files-found: error
          retention-days: 14

  # Two Linux jobs for the same reason as the Windows and macOS pairs: only the tag job sees the updater key. Built on
  # the oldest supported Ubuntu runner so the AppImage, deb and rpm need no newer glibc than 2.35 (Fedora, Debian 12,
  # Ubuntu 22.04 and later). The bundle targets come from src-tauri/tauri.linux.conf.json.
  build-linux:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-linux-deps

      - uses: ./.github/actions/setup-rust
        id: cargo-cache
        with:
          key-prefix: cargo-release

      - uses: ./.github/actions/setup-node-yarn

      - name: Build the AppImage, deb and rpm
        run: yarn tauri:bundle

      - name: Collect the packages
        id: collect
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/keitora-linux"
          mkdir -p "$out"
          for pattern in appimage/Keitora_*_amd64.AppImage deb/Keitora_*_amd64.deb rpm/Keitora-*.x86_64.rpm; do
            files=(target/release/bundle/$pattern)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "Expected exactly one $pattern, found: ${files[*]}" >&2
              exit 1
            fi
            cp "${files[0]}" "$out/"
          done
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: keitora-linux
          path: ${{ steps.collect.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Save cargo cache
        if: env.SAVE_RELEASE_CACHE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
          trim: target/release/bundle

  # Tag runs only. The AppImage is the Linux updater artifact; deb and rpm installs update through the package
  # manager, so only the AppImage gets a .sig. This job never saves the cache.
  build-linux-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # The expression evaluates to a bare true or false, so no secret value reaches this step or its shell.
      - name: Detect the updater key
        id: updater-key
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'true' || 'false' }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-linux-deps

      - uses: ./.github/actions/setup-rust
        with:
          key-prefix: cargo-release

      - uses: ./.github/actions/setup-node-yarn

      # Fails on a tag without the key (UPDATER_KEY_MISSING) or with the placeholder pubkey.
      - name: Compute the bundle overlay
        env:
          UPDATER_KEY: ${{ steps.updater-key.outputs.has_key }}
        run: yarn --silent tsx scripts/bundle-overlay.ts --target linux --out "$RUNNER_TEMP/bundle-overlay.json"

      # The only step that sees the updater key.
      - name: Build the packages and the AppImage's updater signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri:bundle --config "$RUNNER_TEMP/bundle-overlay.json"

      - name: Collect the packages and the signature
        id: collect
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/keitora-linux"
          mkdir -p "$out"
          for pattern in appimage/Keitora_*_amd64.AppImage appimage/Keitora_*_amd64.AppImage.sig \
                         deb/Keitora_*_amd64.deb rpm/Keitora-*.x86_64.rpm; do
            files=(target/release/bundle/$pattern)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "Expected exactly one $pattern, found: ${files[*]}" >&2
              exit 1
            fi
            cp "${files[0]}" "$out/"
          done
          sig=("$out"/Keitora_*_amd64.AppImage.sig)
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          echo "sig=${sig[0]}" >> "$GITHUB_OUTPUT"

      # Tauri only warns when the key does not match the committed pubkey; installed copies would reject the update.
      - name: Check the updater signature's key
        env:
          SIG: ${{ steps.collect.outputs.sig }}
        run: yarn --silent tsx scripts/check-updater-sig.ts "$SIG"

      - uses: actions/upload-artifact@v7
        with:
          name: keitora-linux
          path: ${{ steps.collect.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

  # Two macOS jobs rather than one job with a conditional `environment:`. The signing secrets live in the `release`
  # environment, and a job either names an environment or it does not; an empty-string environment is not a documented
  # way to opt out, so the secret-free job (PR, dispatch, schedule) is kept entirely separate from the tag job.
  # Exactly one of the two runs, and both upload the same artifact name.
  build-macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        id: cargo-cache
        with:
          key-prefix: cargo-release

      - uses: ./.github/actions/setup-node-yarn

      # No environment, no secrets: ad-hoc signed (the stage-sidecars.mjs warning prints). Fork PRs succeed unsigned.
      - name: Build the dmg (ad-hoc)
        run: yarn tauri:bundle

      - name: Find the dmg
        id: dmg
        run: |
          files=(target/release/bundle/dmg/Keitora_*_aarch64.dmg)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "Expected exactly one dmg, found: ${files[*]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: keitora-macos
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # The bundle output is rebuilt every time and already uploaded.
      - name: Save cargo cache
        if: env.SAVE_RELEASE_CACHE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
          trim: target/release/bundle

  # Tag runs only. Signing is required: an ad-hoc release has a different designated requirement and would reset
  # every user's Screen Recording grant. This job never saves the cache (tag-scoped entries are wasted quota).
  build-macos-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    timeout-minutes: 120
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # Each expression evaluates to a bare true or false, so no secret value reaches this step or its shell.
      - name: Require the signing configuration
        env:
          HAS_P12: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && 'true' || 'false' }}
          HAS_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' && 'true' || 'false' }}
          HAS_SHA1: ${{ vars.MACOS_SIGNING_SHA1 != '' && 'true' || 'false' }}
          HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && 'true' || 'false' }}
        run: |
          missing=0
          if [ "$HAS_NOTARY" != "true" ]; then
            echo "::error::Missing notarization secrets APPLE_API_KEY_P8, APPLE_API_KEY or APPLE_API_ISSUER in the release environment. See CONTRIBUTING.md, \"Notarization\"."
            missing=1
          fi
          if [ "$HAS_P12" != "true" ]; then
            echo "::error::Missing secret MACOS_CERTIFICATE_P12 in the release environment. See CONTRIBUTING.md, \"Releases\"."
            missing=1
          fi
          if [ "$HAS_PASSWORD" != "true" ]; then
            echo "::error::Missing secret MACOS_CERTIFICATE_PASSWORD in the release environment. See CONTRIBUTING.md, \"Releases\"."
            missing=1
          fi
          if [ "$HAS_SHA1" != "true" ]; then
            echo "::error::Missing repository variable MACOS_SIGNING_SHA1. See CONTRIBUTING.md, \"Releases\"."
            missing=1
          fi
          exit "$missing"

      # The expression evaluates to a bare true or false, so no secret value reaches this step or its shell.
      - name: Detect the updater key
        id: updater-key
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'true' || 'false' }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-rust
        with:
          key-prefix: cargo-release

      - uses: ./.github/actions/setup-node-yarn

      # Fails on a tag without the key (UPDATER_KEY_MISSING) or with the placeholder pubkey. On macOS the overlay
      # also adds the `app` bundle target, without which the bundler makes no Keitora.app.tar.gz.
      - name: Compute the bundle overlay
        env:
          UPDATER_KEY: ${{ steps.updater-key.outputs.has_key }}
        run: yarn --silent tsx scripts/bundle-overlay.ts --target macos --out "$RUNNER_TEMP/bundle-overlay.json"

      # The only step that sees the certificate secrets; -x keeps the key non-extractable. A self-signed identity must be
      # trusted, since codesign refuses an untrusted root: trust goes in the admin domain (the user domain would raise a
      # GUI prompt) under the relaxed authorizationdb rule; the runner is ephemeral, so nothing is restored. A Developer ID
      # identity only needs its Apple intermediate. The SHA-1 pin makes a wrongly exported identity fail loudly instead
      # of silently resetting users' grants.
      - name: Import and trust the signing identity
        timeout-minutes: 5
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY || 'Keitora Local Signing' }}
          MACOS_SIGNING_SHA1: ${{ vars.MACOS_SIGNING_SHA1 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/keitora-signing.keychain-db"; KC_PASS="$(openssl rand -hex 24)"
          # Path only (never the password) so the cleanup step can find the keychain.
          echo "KEITORA_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$IDENTITY" -p "$KC" > "$RUNNER_TEMP/id.pem"
          if [ "$(openssl x509 -in "$RUNNER_TEMP/id.pem" -noout -subject_hash)" = \
               "$(openssl x509 -in "$RUNNER_TEMP/id.pem" -noout -issuer_hash)" ]; then
            sudo security authorizationdb write com.apple.trust-settings.admin allow
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/id.pem"
          else
            # Apple-issued (Developer ID): the root is already trusted, but the chain also needs the intermediate,
            # which the .p12 may or may not carry. Fetch the one that issued this certificate; an import that
            # finds it already present is fine, because the find-identity -v check below only passes when the
            # chain is complete.
            issuer="$(openssl x509 -in "$RUNNER_TEMP/id.pem" -noout -issuer)"
            case "$issuer" in
              *"Developer ID Certification Authority"*"OU=G2"* | *"OU=G2"*"Developer ID Certification Authority"*)
                ca=DeveloperIDG2CA.cer ;;
              *"Developer ID Certification Authority"*) ca=DeveloperIDCA.cer ;;
              *) echo "::error::Unsupported certificate issuer: $issuer" >&2; exit 1 ;;
            esac
            curl -fsSL --proto '=https' --retry 3 "https://www.apple.com/certificateauthority/$ca" -o "$RUNNER_TEMP/$ca"
            if ! out="$(security import "$RUNNER_TEMP/$ca" -k "$KC" 2>&1)"; then
              case "$out" in
                *"already exists"*) echo "Intermediate $ca is already in the keychain" ;;
                *) echo "$out" >&2; exit 1 ;;
              esac
            fi
          fi
          # The pin must be a full SHA-1: a partial value would match almost any identity. find-identity prints it
          # in upper case; the build step then signs by this hash, so codesign uses exactly this certificate.
          if ! [[ "$MACOS_SIGNING_SHA1" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::MACOS_SIGNING_SHA1 must be the full 40-character SHA-1 from security find-identity." >&2
            exit 1
          fi
          security find-identity -v -p codesigning "$KC" | grep -i -F "$MACOS_SIGNING_SHA1"

      # Stages the sidecar, builds with the bundle overlay, then mounts the dmg and verifies the signature and the
      # stable designated requirement. Tauri's certificate-import variable is deliberately never set: its importer
      # only recognises Apple-issued identity names and would reject this one; codesign finds the identity in the
      # keychain search list instead. Signing by the pinned SHA-1 (codesign accepts a hash) rather than the name
      # guarantees the verified certificate is the one used. The bundler makes Keitora.app.tar.gz from the .app it has
      # just signed with that identity, so an in-app update keeps the stable designated requirement; the script
      # verifies the tarball's copy too. This is the only step that sees the updater key and the notarization key.
      # Notarization: Tauri submits and staples the .app, the script then does the same for the dmg and checks
      # both staples plus Gatekeeper's verdict. Apple usually answers in minutes; notarytool gives up after 30.
      # The App Store Connect key is written to a private file for notarytool and removed whatever happens.
      - name: Build, notarize and verify the signed dmg
        timeout-minutes: 75
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_SHA1 }}
          KEITORA_BUNDLE_OVERLAY: ${{ runner.temp }}/bundle-overlay.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary/AuthKey_${APPLE_API_KEY}.p8"
          trap 'rm -rf "$RUNNER_TEMP/notary"' EXIT
          mkdir -m 700 "$RUNNER_TEMP/notary"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH")
          unset APPLE_API_KEY_P8
          bash scripts/build-dmg.sh

      # One flat folder, so publish finds every file at the top of the artifact.
      - name: Collect the dmg and the updater tarball
        id: collect
        run: |
          files=(target/release/bundle/dmg/Keitora_*_aarch64.dmg)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "Expected exactly one dmg, found: ${files[*]}" >&2
            exit 1
          fi
          tarball=target/release/bundle/macos/Keitora.app.tar.gz
          for f in "$tarball" "$tarball.sig"; do
            [ -f "$f" ] || { echo "Missing updater file: $f" >&2; exit 1; }
          done
          out="$RUNNER_TEMP/keitora-macos"
          mkdir -p "$out"
          cp "${files[0]}" "$tarball" "$tarball.sig" "$out/"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      # Tauri only warns when the key does not match the committed pubkey; installed copies would reject the update.
      - name: Check the updater signature's key
        env:
          SIG: ${{ steps.collect.outputs.dir }}/Keitora.app.tar.gz.sig
        run: yarn --silent tsx scripts/check-updater-sig.ts "$SIG"

      - uses: actions/upload-artifact@v7
        with:
          name: keitora-macos
          path: ${{ steps.collect.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${KEITORA_KEYCHAIN:-}" ] && [ -e "$KEITORA_KEYCHAIN" ]; then
            security delete-keychain "$KEITORA_KEYCHAIN"
          fi

  # Publishes only on a tag push (a manual dispatch on a tag never publishes). One job of each pair is always
  # skipped, so `needs` alone would skip this job too; the explicit result checks on the two tag jobs keep it strict.
  publish:
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build-windows-release.result == 'success' && needs.build-macos-release.result == 'success' && needs.build-linux-release.result == 'success' }}
    needs: [build-windows, build-windows-release, build-macos, build-macos-release, build-linux, build-linux-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: keitora-windows
          path: windows
      - uses: actions/download-artifact@v8
        with:
          name: keitora-macos
          path: macos
      - uses: actions/download-artifact@v8
        with:
          name: keitora-linux
          path: linux
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The installers, plus what the in-app updater downloads and verifies.
          files=(
            windows/Keitora_*_x64-setup.exe
            windows/Keitora_*_x64-setup.exe.sig
            macos/Keitora_*_aarch64.dmg
            macos/Keitora.app.tar.gz
            macos/Keitora.app.tar.gz.sig
            linux/Keitora_*_amd64.AppImage
            linux/Keitora_*_amd64.AppImage.sig
            linux/Keitora_*_amd64.deb
            linux/Keitora-*.x86_64.rpm
          )
          if [ "${#files[@]}" -ne 9 ]; then
            echo "Expected exactly nine release files, found: ${files[*]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "Missing release file: $f" >&2; exit 1; }
          done
          # A re-run of a tag whose release already exists replaces the assets instead of failing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
